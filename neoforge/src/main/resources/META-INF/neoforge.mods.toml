modLoader="javafml"
loaderVersion="[4,)"
license="MIT License"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    displayURL="${display_url}"
    authors="${mod_author}"
    description='''${description}'''

[[mixins]]
    config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type="required"
    versionRange = "[${neoforge_version},)"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"