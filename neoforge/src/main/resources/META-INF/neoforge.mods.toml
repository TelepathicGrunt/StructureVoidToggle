modLoader="javafml"
loaderVersion="[4,)"
license="MIT License"
issueTrackerURL="${issues_url}"
sourcesUrl="${sources_url}"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_display_name}"
    displayURL="${homepage_url}"
    authors="${mod_author}"
    description='''${mod_description}'''

[[mixins]]
    config = "${mod_id}.mixins.json"

[dependencies]
"${mod_id}" = [
    { modId = "neoforge", type = "required", versionRange = "*", ordering = "NONE", side = "BOTH" },
    { modId = "minecraft", type = "required", versionRange = "[1.21.5,)", ordering = "NONE", side = "BOTH" },
]